<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#134C57">
  <meta name="description" content="Encontre destinos, mapa e dicas de Alter do Chão.">
  <title>Guia de Alter do Chão | Turismo Aqui</title>
  <link rel="icon" type="image/png" href="../design-system/assets/icone-turismo-aqui.png">
  <link rel="stylesheet" href="../design-system/tokens.css">
  <link rel="stylesheet" href="../design-system/components.css">
  <link rel="stylesheet" href="../site/style.css">
  <link rel="stylesheet" href="../site/landing.css">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body class="ta">
  <a class="skip ta-button ta-button--primary" href="#conteudo">Pular para o conteúdo</a>
  <header class="app-header" id="inicio"><div class="app-header-inner wrap">
    <a class="app-brand" href="#inicio" aria-label="Turismo Aqui, início"><img src="../design-system/assets/turismo-aqui.svg" alt="Turismo Aqui" width="96" height="104"></a>
    <nav class="guide-nav" aria-label="Navegação do guia"><a href="#lugares"><svg class="ta-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg><span>Destinos</span></a><a href="#mapa"><svg class="ta-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15m6-12v15"/></svg><span>Mapa</span></a><a href="#dicas"><svg class="ta-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6m-5 3h4M8 14c-1.4-1.2-2-2.8-2-4a6 6 0 1 1 12 0c0 1.2-.6 2.8-2 4-.7.6-1 1.2-1 2H9c0-.8-.3-1.4-1-2z"/></svg><span>Dicas</span></a><a href="#videos"><svg class="ta-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/></svg><span>Vídeos</span></a></nav>
    <a class="app-header-link" href="../site/">Conheça o projeto</a>
  </div></header>
  <main id="conteudo">
    <section class="app-welcome wrap" aria-labelledby="guide-title">
      <figure class="app-welcome-media" data-asset="quadro-vila-alter-aerea"><img src="../entregaveis/catalogo-visual/imagens/IwLYaCVu5BI/000021360.jpg" alt="Vista aérea da vila de Alter do Chão, com o rio e barcos na margem" width="1920" height="1080" fetchpriority="high"></figure>
      <div class="app-welcome-copy"><span class="app-eyebrow">ALTER DO CHÃO, PARÁ</span><h1 id="guide-title">Explore Alter do Chão</h1>
        <label class="ta-field guide-search"><svg class="ta-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg><span class="sr-only">Buscar lugares e temas</span><input id="search" type="search" placeholder="Buscar lugares ou experiências" aria-controls="places"></label>
      </div>
    </section>
    <div class="app-explore-layout wrap">
    <section class="hub-section explorer" id="lugares" aria-labelledby="lugares-titulo">
      <div class="section-heading"><div><h2 id="lugares-titulo">Destinos</h2></div></div>
      <p id="load-status" class="journal-status" role="status">Carregando destinos…</p>
      <noscript><p>Ative o JavaScript para explorar os lugares e as dicas.</p></noscript>
      <div class="hub-grid" id="places"></div>
      <p class="ta-notice ta-notice--info" id="empty" role="status" hidden>Nenhum lugar encontrado. Tente outro nome.</p>
    </section>

    <section id="mapa" class="destination guide-map-section" aria-labelledby="map-title">
      <div class="guide-map-layout">
        <div class="guide-map-copy">
          <h2 id="map-title">Mapa</h2>
          <div id="map-controls" hidden>
            <label for="map-place">Escolher um lugar</label>
            <select id="map-place"></select>
          </div>
        </div>
        <div class="ta-card guide-map-frame">
          <p id="map-status" class="ta-notice ta-notice--info" role="status">Mapa indisponível no momento.</p>
          <iframe id="map-frame" title="Mapa da região de Alter do Chão pelo OpenStreetMap" loading="lazy" hidden></iframe>
        </div>
      </div>
    </section>

    </div>
    <section class="hub-section wrap" id="dicas" aria-labelledby="tips-title">
      <h2 id="tips-title">Dicas de viagem</h2>
      <div class="hub-grid" id="tips-list"></div>
    </section>

    <section class="hub-section wrap" id="videos" aria-labelledby="videos-title">
      <h2 id="videos-title">Vídeos do canal</h2>
      <div class="hub-grid" id="videos-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap landing-footer">
      <a class="app-footer-brand" href="#inicio" aria-label="Turismo Aqui, voltar ao início"><img src="../design-system/assets/turismo-aqui.svg" alt="Turismo Aqui" width="96" height="104"></a>
      <nav aria-label="Materiais e canais">
        <a href="../">Central</a>
        <a href="../entregaveis/guia-alter-do-chao-prototipo.pdf">Ebook (PDF)</a>
        <a href="../entregaveis/guia-alter.webm?v=161e4bc1d53f">Vídeo do guia</a>
        <a href="https://www.youtube.com/@TurismoAqui">YouTube</a>
      </nav>
    </div>
  </footer>
</body>
</html>
