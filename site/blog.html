<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Roteiros, comunidades e histórias da Amazônia contados pelo Turismo Aqui.">
  <title>Revista Turismo Aqui | A Amazônia por quem vive aqui</title>
  <link rel="icon" type="image/png" href="../design-system/assets/icone-turismo-aqui.png">
  <link rel="stylesheet" href="../design-system/tokens.css">
  <link rel="stylesheet" href="../design-system/components.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="landing.css">
  <script type="module" src="app.js"></script>
</head>
<body class="ta">
  <a class="skip ta-button ta-button--primary" href="#conteudo">Pular para o conteúdo</a>
  <header class="site-header" id="inicio">
    <div class="wrap site-nav site-nav--products">
      <a class="brand" href="./" aria-label="Site Turismo Aqui">
        <img src="../design-system/assets/turismo-aqui.svg" alt="Turismo Aqui" width="96" height="104">
      </a>
      <nav aria-label="Navegação principal">
        <a class="nav-link" href="./">Site</a>
        <a class="nav-link" href="blog.html" aria-current="page">Revista</a>
        <a class="nav-link" href="../app/">Destinos</a>
        <a class="ta-button ta-button--secondary" href="../">Central</a>
      </nav>
    </div>
  </header>

  <main id="conteudo">
    <section class="hub-hero hub-hero--journal" aria-labelledby="journal-title">
      <div class="wrap hub-hero-content">
        <h1 id="journal-title">Revista <em>Turismo Aqui</em></h1>
        <div class="section-actions">
          <a class="ta-button ta-button--accent" href="#revista">Em destaque</a>
          <a class="ta-button ta-button--inverse" href="#journal-archive">Mais matérias</a>
        </div>
      </div>
      <figure class="hub-hero-media" data-asset="quadro-orla-pescador">
        <img src="../entregaveis/catalogo-visual/imagens/BH4RW20oZdg/000093533.jpg"
             alt="Pescador junto ao guarda-corpo na orla de Santarém" width="1920" height="1080" fetchpriority="high">
        <figcaption><a href="https://www.youtube.com/watch?v=BH4RW20oZdg&amp;t=93s"><span data-photo-title>Orla de Santarém</span> · <span data-photo-credit>Turismo Aqui, 1:33</span></a></figcaption>
      </figure>
    </section>

    <div id="post-list" class="wrap">
      <section id="revista" class="hub-section" aria-labelledby="featured-title">
        <h2 id="featured-title">Em destaque</h2>
        <p id="journal-status" class="journal-status" role="status">Carregando as matérias…</p>
        <noscript><p>Ative o JavaScript para ler as matérias.</p></noscript>
        <div id="featured-posts" class="hub-grid"></div>
      </section>
      <section id="journal-archive" class="hub-section" aria-labelledby="archive-title" hidden>
        <h2 id="archive-title">Mais da revista</h2>
        <div id="archive-posts" class="hub-grid"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap landing-footer">
      <span>Turismo Aqui</span>
      <nav aria-label="Explore o projeto">
        <a href="../">Central</a>
        <a href="./#destino" id="destino">Alter do Chão</a>
        <a href="./#historia" id="historia">Sobre o canal</a>
        <a href="../entregaveis/guia-alter-do-chao-prototipo.pdf">Ebook (PDF)</a>
        <a href="../entregaveis/guia-alter.webm?v=161e4bc1d53f">Vídeo do guia</a>
      </nav>
    </div>
  </footer>

  <dialog id="article-dialog" class="ta-dialog article-dialog" aria-labelledby="article-title">
    <div class="article-top">
      <span class="eyebrow">Revista Turismo Aqui</span>
      <button type="button" id="close-article" class="ta-button ta-button--secondary ta-button--icon" aria-label="Fechar artigo" autofocus>×</button>
    </div>
    <article id="article-content" class="article-content"></article>
  </dialog>
</body>
</html>
